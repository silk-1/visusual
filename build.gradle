plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = "${mod_version}+mc${minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    // Loom 1.19.x itself requires a Java 25 JVM (the official Fabric 1.21.10 template
    // builds on JDK 25), but the mod must stay a Java 21 artifact for players.
    // So: no toolchain pin - Gradle runs on JDK 25, bytecode is released at 21.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all,-processing'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Dependency-free self checks for the Minecraft-independent core.
// Runs on a plain JDK: ./gradlew selfCheck  (no JUnit / no external libraries).
// JUnit is deliberately not used yet: no network access to Maven Central in the
// authoring environment, and the core is testable with plain assertions.
// There is no JUnit on purpose (dependency policy): the checks are plain Java in
// src/test/java and run through 'selfCheck'. Gradle 9 fails a test task that
// discovers no tests, so that guard is disabled for this project.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Runs SILKVIS core self checks (config, layout, map, media IPC, destinations).'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'silkvis.verify.SelfCheck'
    // A leaked non-daemon thread once left this task running forever after the report.
    // The checks finish in seconds; five minutes means something is genuinely wrong.
    timeout = java.time.Duration.ofMinutes(5)
}

// 'build' must mean "verified", not just "compiled": the dependency-free checks
// run as part of it, so a red selfCheck fails the build like a red test would.
tasks.named('build') {
    dependsOn tasks.named('selfCheck')
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
