# Gradle Wrapper 9.8.2 - the exact pair used by the official Fabric 1.21.10
# template (FabricMC/fabric-example-mod@1.21.10).
# The wrapper JAR is committed, so a local Gradle installation is NOT required:
# just run `gradlew.bat build` (Windows) or `./gradlew build`.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
